name: olabisi-pyenv
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - anndata=0.11.4
  - scanpy=1.11.5
  - pydeseq2=0.5.4
  - decoupler-py=2.1.4
  - statsmodels>=0.14,<0.15
  - matplotlib=3.10.9
  - plotnine=0.15.7
  - seaborn=0.13.2
  - marsilea=0.6.2
  - pybiomart
  - python-igraph
  - leidenalg
  - pyyaml
  - pytest
  - pytest-mpl
  - scikit-image
