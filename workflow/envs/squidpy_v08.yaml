name: squidpy_v08
channels:
  - conda-forge
  - bioconda
dependencies:
  - python<3.11
  - jupyterlab
  - numpy<2 # breaks things if >2
  - scanpy
  - decoupler-py>=2
  - statsmodels>=0.14.4
  - squidpy
  - bioconda::liana=1.7.1
  - bioconda::palantir
  - conda-forge::mellon=1.7.1
  - scipy>=1.15.2 # jax below works well with this version + same as squidpy_v06
  - jax>=0.4.25,<0.5 # minimum version to avoid issue with mellon importing jax importing scipy.linalg.tril (which was later removed)
  - jaxlib>=0.4.25,<0.5 # minimum version to avoid issue with mellon importing jax importing scipy.linalg.tril (which was later removed)
#  - scipy=1.12.* # necessary to avoid issue with mellon importing jax importing scipy.linalg.tril (which was later removed)
  - plotnine
  - harmonypy
  - leidenalg
  - muon
  - mudata
  - pydeseq2
  - anytree
  - igraph
  - graphviz
  - python-igraph
  - scikit-bio
  - mofapy2
  - marsilea
  - pybiomart
  - pip

## Changes from prev version
### palantir and mellon for trajectory and gene trend analysis
