name: squidpy_v06
channels:
  - conda-forge
  - bioconda
dependencies:
  - python<3.11
  - jupyterlab
  - numpy<2 # breaks things if >2
  - scanpy
  - decoupler-py>=2
  - statsmodels>=0.14.4
  - squidpy>=1.6.2 # to fix import error https://github.com/scverse/squidpy/issues/915
  - bioconda::liana
  - conda-forge::mofax
  - plotnine
  - harmonypy
  - leidenalg
  - muon
  - mudata
  - pydeseq2
  - anytree
  - igraph
  - graphviz
  - python-igraph
  - scikit-bio
  - mofapy2
  - marsilea
  - pybiomart
  - pip

## Changes from prev version
### Added: mudata installed explicitly (it was installed but not found for some obscure reason)
### Removed: pip installations (nichePCA)
