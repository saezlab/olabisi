restart-times: 0
jobscript: "slurm-jobscript.sh"
cluster: "slurm-submit.py"
cluster-status: "slurm-status.py"
cluster-cancel: "scancel"
max-jobs-per-second: 1
max-status-checks-per-second: 10
local-cores: 16
latency-wait: 120
use-conda: True
use-singularity: True
use-envmodules: True
jobs: 6
default-resources:
    - runtime=120
    - mem_mb=16000
    - partition="cpu-single"
