# options for F_pseudobulks_reducedGrp, makeMudata
mudata_opts:
  # grp(IgAN)
  ## batch(all)
  grp(IgAN)_batch(all)_combatHVG(True):
    group: 'IgAN'
    batch: 'all'
    combatHVG: 'True'
    add_paired_ctrls: 'False'
    mask_sample_filter: "(condition=='IgAN')&(eGFR_calc>=60)"
    formula_right: 'prot_log+ageatvisit+sex|prot_bin+ageatvisit+sex'
